[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wan3-video"
version = "0.3.0"
description = "Wan 3.0 video API client (text, frames, references, video edit) with an MCP server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
test = ["pytest>=8"]

[project.scripts]
wan3-mcp = "wan3.mcp_server:main"

[tool.setuptools]
packages = ["wan3"]
